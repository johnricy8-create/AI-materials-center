services:
  backend:
    image: heinrich8/ai-asset-hub-backend:v0.1.0
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/asset_hub.db
      STORAGE_DIR: /storage
    volumes:
      - ./backend/data:/data
      - ./storage:/storage
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: heinrich8/ai-asset-hub-frontend:v0.1.0
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
