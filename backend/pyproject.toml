[project]
name = "ai-asset-hub"
version = "0.1.0"
description = "AI Asset Hub backend — upload, parse, search and generate with AI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.21",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "pymupdf>=1.26",
  "python-docx>=1.2",
  "markdown-it-py>=4.0",
  "charset-normalizer>=3.4",
  "pillow>=11.3",
  "jieba>=0.42",
  "anyio>=4.9",
  "httpx>=0.28",
  "sqlite-vec>=0.1.9",
  "langgraph>=1.2.18",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
